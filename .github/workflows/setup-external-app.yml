name: Setup External App

# Bootstraps (or rotates) a Salesforce External Client App end-to-end:
#   1. resolve-env — maps the org-env input to a WIF environment claim + GCP secret name
#   2. setup       - log in via the existing devhub/integration/production JWT credential
#                    (read-only GCP claim), generate a fresh keypair, create/update the
#                    External Client App. Runs in the sf-ci container (needs the `sf` CLI).
#   3. verify      - prove the fresh key actually logs in, from a throwaway container
#                    (scripts/verify-login-container.sh). Runs on the bare runner, not
#                    sf-ci, because this step itself shells out to `docker run` — no
#                    docker-in-docker access from inside a container job.
#   4. sync-secret - write the fresh JWT bundle back to GCP Secret Manager (write-only
#                    gcp-secrets-admin claim) so it's the credential going forward, gated
#                    on `verify` succeeding first
#
# setup and sync-secret need different WIF environment claims, and a GitHub Actions job can
# only declare one `environment:` — hence separate jobs, with the new private key AND the
# consumer key handed from job 2 onward as a short-retention workflow artifact (never
# committed, never logged; masked wherever it touches a log line). The consumer key rides in
# the artifact rather than as a job `outputs:` value because job outputs set from a step
# running in a `container:` don't reliably reach a dependent job's `needs.*` context.

on:
  workflow_dispatch:
    inputs:
      org-env:
        description: "Target org environment"
        required: true
        type: choice
        options: [devhub, integration, demo-prod]
        default: devhub
      app-name:
        description: "External Client App name"
        required: true
        default: TestQA
      preauth-username:
        description: "Username to pre-authorize for JWT login"
        required: true

concurrency:
  group: setup-external-app-${{ inputs.org-env }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gforce-salesforce-cicd

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      read-claim: ${{ steps.map.outputs.read-claim }}
      secret-name: ${{ steps.map.outputs.secret-name }}
    steps:
      - id: map
        run: |
          set -euo pipefail
          case "${{ inputs.org-env }}" in
            devhub)      echo "read-claim=devhub" >> "$GITHUB_OUTPUT" ;;
            integration) echo "read-claim=integration" >> "$GITHUB_OUTPUT" ;;
            demo-prod)   echo "read-claim=production" >> "$GITHUB_OUTPUT" ;;
            *)           echo "::error::Unknown org-env '${{ inputs.org-env }}'" >&2; exit 1 ;;
          esac
          echo "secret-name=salesforce-${{ inputs.org-env }}" >> "$GITHUB_OUTPUT"

  setup:
    needs: resolve-env
    runs-on: ubuntu-latest
    # sf CLI comes from the image, not from npm — rules in sf-docker-images'
    # docs/using-in-github-actions.md. 3.1.0+ needs no `options:` (defaults to
    # the runner's own UID 1001); `defaults.run.shell: bash` is required
    # because container jobs default to `sh`, which has no `-o pipefail`.
    container: gforceinnovation/sf-ci:3.1.0
    defaults:
      run:
        shell: bash
    environment: ${{ needs.resolve-env.outputs.read-claim }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Log in to the org (JWT via GCP secret)
        uses: Gforce-Innovation-Kft/shared-github-actions/.github/actions/sf-org-login@v2
        with:
          auth-method: jwt
          credential-source: gcp
          gcp-workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-project-id: ${{ env.GCP_PROJECT_ID }}
          gcp-secret-name: ${{ needs.resolve-env.outputs.secret-name }}
          org-alias: target
          set-default-dev-hub: ${{ inputs.org-env == 'devhub' }}

      - name: Generate a fresh JWT keypair
        run: npm run generate:jwt -- --env "${{ inputs.org-env }}" --force

      - name: Setup External Client App
        id: setup-app
        run: |
          set -euo pipefail
          npm run setup-app -- \
            --org target \
            --app-name "${{ inputs.app-name }}" \
            --preauth-username "${{ inputs.preauth-username }}" \
            --cert-file "$HOME/.sf-jwt/${{ inputs.org-env }}/server.crt" | tee setup-app.log
          CONSUMER_KEY=$(sed -n 's/^consumerKey=//p' setup-app.log)
          if [ -z "$CONSUMER_KEY" ]; then
            echo "::error::setup-app printed no consumerKey line." >&2
            exit 1
          fi
          echo "::add-mask::$CONSUMER_KEY"
          printf '%s' "$CONSUMER_KEY" > consumer-key.txt

      - name: Stage the private key for upload
        # Workspace-relative, not `${{ runner.temp }}`: a container job only
        # bind-mounts `$GITHUB_WORKSPACE` (`/__w/...`) into the container, so
        # the host's `_temp` path doesn't exist in here and `cp` 404s.
        run: cp "$HOME/.sf-jwt/${{ inputs.org-env }}/server.key" server.key

      - name: Upload the new key + consumer key (workflow-scoped, 1-day retention)
        # consumer-key.txt travels in the same artifact as the private key,
        # not as a job `outputs:` value — job outputs set from a step running
        # in a `container:` don't reliably reach a dependent job's `needs.*`
        # context (confirmed empty on a live run despite the step itself
        # producing a non-empty value); the artifact is the one handoff
        # mechanism proven to survive the container boundary.
        uses: actions/upload-artifact@v7
        with:
          name: jwt-key-${{ inputs.org-env }}
          path: |
            server.key
            consumer-key.txt
          retention-days: 1

  verify:
    needs: [resolve-env, setup]
    runs-on: ubuntu-latest
    # Bare runner, not the sf-ci container: this step shells out to `docker run`
    # itself (scripts/verify-login-container.sh) to prove the JWT login works
    # from a throwaway container — a container job has no docker-in-docker
    # access to do that from inside the sf-ci image.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: jwt-key-${{ inputs.org-env }}
          path: ${{ runner.temp }}/jwt-key

      - name: Verify JWT login in a disposable container
        run: |
          set -euo pipefail
          CONSUMER_KEY=$(cat "${{ runner.temp }}/jwt-key/consumer-key.txt")
          echo "::add-mask::$CONSUMER_KEY"
          npm run integration:test -- \
            "${{ inputs.preauth-username }}" \
            "$CONSUMER_KEY" \
            "${{ runner.temp }}/jwt-key"

  sync-secret:
    # Needs `verify`, not just `setup` — the fresh key must prove it can log in
    # before it overwrites the last known-good credential in GCP.
    needs: [resolve-env, setup, verify]
    runs-on: ubuntu-latest
    environment: gcp-secrets-admin
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: jwt-key-${{ inputs.org-env }}
          path: /tmp/jwt-key

      - name: Authenticate to Google Cloud (Direct WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Upload the new JWT bundle to GCP Secret Manager
        run: |
          set -euo pipefail
          CONSUMER_KEY=$(cat /tmp/jwt-key/consumer-key.txt)
          echo "::add-mask::$CONSUMER_KEY"
          npm run sync:secret -- \
            --gcp-project-id "${{ env.GCP_PROJECT_ID }}" \
            --gcp-secret-name "${{ needs.resolve-env.outputs.secret-name }}" \
            --username "${{ inputs.preauth-username }}" \
            --client-id "$CONSUMER_KEY" \
            --key-file /tmp/jwt-key/server.key
